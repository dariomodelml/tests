<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelML Logo, Materialized</title>
<style>
  /* Deliberately single-theme: a black studio stage, regardless of host theme. */
  :root{
    --bg: #000000;
    --bg-2: #000000;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.12);
    --ink: #f3f4f5;
    --ink-dim: #8b9096;
    --accent: #9fb4c4;
    --accent-ink: #05070a;
    --hairline: rgba(255,255,255,0.12);
    --shadow: 0 10px 34px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow:hidden;
  }

  #stage{
    position:fixed;
    inset:0;
  }
  #stage canvas{
    display:block;
    touch-action:none;
  }

  .veil{
    position:fixed;
    inset:0;
    pointer-events:none;
  }
  .veil.top{
    top:0; height:150px;
    background:linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
    opacity:0.0;
  }

  header{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 26px;
    z-index:5;
    pointer-events:none;
  }
  header > *{ pointer-events:auto; }

  .toolbar{
    display:flex;
    gap:6px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius:12px;
    padding:5px;
    box-shadow: var(--shadow);
  }
  .toolbar button{
    appearance:none;
    border:none;
    background:transparent;
    color: var(--ink-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.02em;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition: background 0.15s ease, color 0.15s ease;
    white-space:nowrap;
  }
  .toolbar button:hover{ color: var(--ink); background: var(--hairline); }
  .toolbar button.active{ background: var(--accent); color: var(--accent-ink); }
  .toolbar button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:currentColor;
    opacity:0.55;
  }
  .toolbar button.active .dot{ opacity:1; }
  .sep{ width:1px; align-self:stretch; background:var(--hairline); margin:4px 2px; }

  .controls{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%);
    z-index:5;
    display:flex;
    flex-direction:row;
    gap:16px;
  }
  .control-group{
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius:12px;
    padding:10px;
    box-shadow: var(--shadow);
  }
  .control-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--ink-dim);
    text-align:center;
    padding:2px 4px 8px;
  }
  .segmented{
    display:flex;
    flex-direction:row;
    gap:3px;
  }
  .segmented button{
    appearance:none;
    border:none;
    background:transparent;
    color: var(--ink-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.01em;
    text-align:center;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .segmented button:hover{ color: var(--ink); background: var(--hairline); }
  .segmented button.active{ background: var(--accent); color: var(--accent-ink); font-weight:600; }
  .segmented button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  #loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    z-index:20;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--ink-dim);
    transition: opacity 0.4s ease;
  }
  #loading .ring{
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid var(--hairline);
    border-top-color: var(--accent);
    margin-right:10px;
    animation: spin 0.9s linear infinite;
  }
  #loading .row{ display:flex; align-items:center; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width: 640px){
    header{ padding:14px; justify-content:center; }
    .toolbar{ flex-wrap:wrap; justify-content:center; max-width:280px; }
    .toolbar button{ padding:10px 14px; }
    .controls{
      left:16px; right:16px; bottom:16px; transform:none;
      justify-content:center;
    }
    .control-group{ width:auto; }
    .segmented{ flex-wrap:wrap; justify-content:center; }
  }

  @media (prefers-reduced-motion: reduce){
    #loading .ring{ animation:none; }
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

</head>
<body>
<div id="loading"><div class="row"><div class="ring"></div>casting model&hellip;</div></div>

<div id="stage"></div>

<div class="controls">
  <div class="control-group">
    <div class="control-label">Lighting</div>
    <div class="segmented" id="light-group">
      <button data-light="studio" class="active" aria-pressed="true">01</button>
      <button data-light="top" aria-pressed="false">02</button>
      <button data-light="hdri" aria-pressed="false">03</button>
    </div>
  </div>
</div>

<header>
  <div class="toolbar">
    <button id="btn-reset" aria-pressed="false">Reset</button>
    <div class="sep"></div>
    <button id="btn-rotate" class="active" aria-pressed="true"><span class="dot"></span>Auto-rotate</button>
  </div>
</header>

  // object is ever seen at; only orbiting (drag/flick) can move the camera.
  var FRONT_POS = [13, 6.2, 82.5];
  var FRONT_TARGET = [0, 0.2, 0];
  var FIXED_DISTANCE = Math.sqrt(
    (FRONT_POS[0]-FRONT_TARGET[0])*(FRONT_POS[0]-FRONT_TARGET[0]) +
    (FRONT_POS[1]-FRONT_TARGET[1])*(FRONT_POS[1]-FRONT_TARGET[1]) +
    (FRONT_POS[2]-FRONT_TARGET[2])*(FRONT_POS[2]-FRONT_TARGET[2])
  );

  init();
  animate();

  function buildShapeGeometry(mat){
    var group = new THREE.Group();

    SHAPES.forEach(function(pts){
      var shape = new THREE.Shape();
      pts.forEach(function(p, i){
        if(i === 0) shape.moveTo(p[0], p[1]);
        else shape.lineTo(p[0], p[1]);
      });
      shape.closePath();
      // No bevel: this shape has several concave (reflex) corners, and
      // ExtrudeGeometry's bevel step can miter those into stray diagonal
      // facets and even leave a hairline crack at the corner. A plain,
      // un-bevelled extrusion keeps every edge exactly 90 degrees and the
      // surface fully closed.
      var geo = new THREE.ExtrudeGeometry(shape, {
        depth: DEPTH,
        bevelEnabled: false,
        curveSegments: 1
      });
      geo.translate(0, 0, -DEPTH/2);
      geo.computeVertexNormals();
      var m = new THREE.Mesh(geo, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
    });
    return group;
  }

  var keyLight, fillLight, rimLight, topLight, hemiLight, ambientLight;

  function init(){
    stage = document.getElementById('stage');
    var w = stage.clientWidth || window.innerWidth;
    var h = stage.clientHeight || window.innerHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    camera = new THREE.PerspectiveCamera(32, w / h, 0.1, 200);
    // Start close to face-on. The extrusion is as deep as it is wide, so a
    // wide 3/4 angle (the old default) makes the side wall read as big as
    // the front face and the silhouette stops looking like the flat logo.
    camera.position.set(FRONT_POS[0], FRONT_POS[1], FRONT_POS[2]);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    stage.appendChild(renderer.domElement);

    loadHdriEnvironment();

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.rotateSpeed = ROTATE_SPEED;
    controls.dampingFactor = DAMPING;
    controls.target.set(FRONT_TARGET[0], FRONT_TARGET[1], FRONT_TARGET[2]);
    // Zoom is intentionally disabled — the object is always framed at the
    // same fixed distance. minDistance/maxDistance are pinned to that same
    // value as a belt-and-braces guard, since OrbitControls re-clamps the
    // camera's radius on every update() regardless of enableZoom.
    controls.enableZoom = false;
    controls.minDistance = FIXED_DISTANCE;
    controls.maxDistance = FIXED_DISTANCE;
    controls.autoRotate = autoRotate;
    controls.autoRotateSpeed = 2.1;
    // Note: no 'start' listener turning autoRotate off here on purpose —
    // when auto-rotate is on, grabbing and flicking the object adds to the
    // spin instead of cancelling it, and the steady auto-rotation carries
    // on by itself once the flick's own momentum decays.

    currentMaterial = makeMaterial();
    meshGroup = buildShapeGeometry(currentMaterial);
    scene.add(meshGroup);

    // Plain, punctual studio rig — no environment map, no floor. Every
    // light is bright enough on its own to read clearly against black,
    // and presets below just re-aim/re-tune these same four lights.
    keyLight = new THREE.DirectionalLight(0xffffff, 1);
    scene.add(keyLight);
    fillLight = new THREE.DirectionalLight(0xffffff, 1);
    scene.add(fillLight);
    rimLight = new THREE.DirectionalLight(0xffffff, 1);
    scene.add(rimLight);
    topLight = new THREE.DirectionalLight(0xffffff, 1);
    scene.add(topLight);
    hemiLight = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
    scene.add(hemiLight);
    ambientLight = new THREE.AmbientLight(0xffffff, 1);
    scene.add(ambientLight);

    applyLighting(currentLightingKey);
    setRotate(autoRotate);

    // ResizeObserver reacts to the stage element's own box changing size —
    // a panel being resized, an orientation change, anything — not only a
    // top-level window resize event, which is what a plain 'resize'
    // listener would miss when this page is embedded.
    if(typeof ResizeObserver !== 'undefined'){
      new ResizeObserver(function(){ onResize(); }).observe(stage);
    } else {
      window.addEventListener('resize', onResize);
    }
    window.addEventListener('orientationchange', onResize);

    document.getElementById('btn-rotate').addEventListener('click', function(){ setRotate(!autoRotate); });
    document.getElementById('btn-reset').addEventListener('click', goReset);

    Array.prototype.forEach.call(document.querySelectorAll('#light-group button'), function(btn){
      btn.addEventListener('click', function(){ applyLighting(btn.getAttribute('data-light')); });
    });

    requestAnimationFrame(function(){
      setTimeout(function(){
        var el = document.getElementById('loading');
        el.style.opacity = '0';
        setTimeout(function(){ el.style.display = 'none'; }, 420);
      }, 200);
    });
  }

  function loadHdriEnvironment(){
    pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    new THREE.TextureLoader().load(HDRI_IMAGE_DATA_URI, function(texture){
      texture.encoding = THREE.sRGBEncoding;
      var envRT = pmremGenerator.fromEquirectangular(texture);
      hdriEnvMap = envRT.texture;
      texture.dispose();
      pmremGenerator.dispose();
      // fromEquirectangular leaves the renderer pointed at its own offscreen
      // render target — hand it back to the canvas explicitly, or nothing
      // ever paints the visible frame again.
      renderer.setRenderTarget(null);
      if(currentLightingKey === 'hdri'){
        currentMaterial.envMap = hdriEnvMap;
        currentMaterial.envMapIntensity = 1.4;
        currentMaterial.roughness = HDRI_ROUGHNESS;
        currentMaterial.clearcoatRoughness = HDRI_CLEARCOAT_ROUGHNESS;
        currentMaterial.needsUpdate = true;
      }
    });
  }

  function goReset(){
    setRotate(false);
    camera.position.set(FRONT_POS[0], FRONT_POS[1], FRONT_POS[2]);
    controls.target.set(FRONT_TARGET[0], FRONT_TARGET[1], FRONT_TARGET[2]);
    controls.update();
  }

  function setRotate(v){
    autoRotate = v;
    controls.autoRotate = v;
    var btn = document.getElementById('btn-rotate');
    btn.classList.toggle('active', v);
    btn.setAttribute('aria-pressed', v);
  }

  function applyLighting(key){
    var p = LIGHTING[key];
    if(!p) return;
    currentLightingKey = key;

    keyLight.intensity = p.key.intensity;
    keyLight.position.set(p.key.pos[0], p.key.pos[1], p.key.pos[2]);
    keyLight.color.setHex(p.key.color);

    fillLight.intensity = p.fill.intensity;
    fillLight.position.set(p.fill.pos[0], p.fill.pos[1], p.fill.pos[2]);
    fillLight.color.setHex(p.fill.color);

    rimLight.intensity = p.rim.intensity;
    rimLight.position.set(p.rim.pos[0], p.rim.pos[1], p.rim.pos[2]);
    rimLight.color.setHex(p.rim.color);

    topLight.intensity = p.top.intensity;
    topLight.position.set(p.top.pos[0], p.top.pos[1], p.top.pos[2]);
    topLight.color.setHex(p.top.color);

    hemiLight.intensity = p.hemi.intensity;
    hemiLight.color.setHex(p.hemi.sky);
    hemiLight.groundColor.setHex(p.hemi.ground);

    ambientLight.intensity = p.ambient;

    if(p.hdri && hdriEnvMap){
      currentMaterial.envMap = hdriEnvMap;
      currentMaterial.envMapIntensity = 1.4;
      currentMaterial.roughness = HDRI_ROUGHNESS;
      currentMaterial.clearcoatRoughness = HDRI_CLEARCOAT_ROUGHNESS;
      currentMaterial.needsUpdate = true;
    } else {
      if(currentMaterial.envMap){
        currentMaterial.envMap = null;
      }
      currentMaterial.roughness = BASE_ROUGHNESS;
      currentMaterial.clearcoatRoughness = BASE_CLEARCOAT_ROUGHNESS;
      currentMaterial.needsUpdate = true;
    }

    Array.prototype.forEach.call(document.querySelectorAll('#light-group button'), function(btn){
      var active = btn.getAttribute('data-light') === key;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active);
    });
  }

  function onResize(){
    var w = (stage && stage.clientWidth) || window.innerWidth;
    var h = (stage && stage.clientHeight) || window.innerHeight;
    if(w < 1 || h < 1) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
})();
</script>

</body>
</html>
